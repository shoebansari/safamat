# Render Blueprint — .NET API via Docker (Render has no native dotnet runtime)
# Repo: https://github.com/shoebansari/safamat
services:
  - type: web
    name: matrimonial-admin-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: JwtSettings__Secret
        generateValue: true
      - key: JwtSettings__Issuer
        value: MatrimonialAdminApi
      - key: JwtSettings__Audience
        value: MatrimonialAdminClient
      - key: JwtSettings__ExpiryMinutes
        value: "480"
      - key: AllowedOrigins__0
        sync: false
