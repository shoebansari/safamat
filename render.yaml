# Render Blueprint — .NET API via Docker (Render has no native dotnet runtime)
# Repo: https://github.com/shoebansari/safamat
# Neon: set ConnectionStrings__DefaultConnection in Render dashboard (PostgreSQL URL)
# CORS: production allows https://*.vercel.app automatically (see Program.cs)
services:
  - type: web
    name: matrimonial-admin-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    branch: main
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: JwtSettings__Secret
        sync: false
      - key: SeedDemoData
        value: "false"
      - key: JwtSettings__Issuer
        value: MatrimonialAdminApi
      - key: JwtSettings__Audience
        value: MatrimonialAdminClient
      - key: JwtSettings__ExpiryMinutes
        value: "480"
      - key: EnableSwagger
        value: "true"
